name: Deploy SHAAR (Azure Static Web Apps)

# Disparo manual apenas, enquanto o secret AZURE_STATIC_WEB_APPS_API_TOKEN nao
# tiver um token valido do Static Web App. Assim o repositorio nao acumula falha
# a cada push. Quando o token estiver correto, devolver os gatilhos de push e PR.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build e deploy
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, lfs: false }

      - name: Deploy para Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'site'   # HTML estatico, sem build
          api_location: ''
          output_location: ''
          skip_app_build: true

  close_pr_environment:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Encerrar ambiente de preview do PR
    steps:
      - name: Fechar
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
