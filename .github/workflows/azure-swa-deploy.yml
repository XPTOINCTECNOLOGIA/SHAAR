name: Deploy Azure Static Web App (SHAAR)
on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'scripts/deploy-azure.sh'
      - '.github/workflows/azure-swa-deploy.yml'
  workflow_dispatch:
concurrency:
  group: swa-deploy-shaar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Publicar SHAAR no Azure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Publicar site/ no swa-shaar (reusa scripts/deploy-azure.sh)
        env:
          SUPABASE_URL: https://api.xptoinc.com.br
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2bmZpZnhpcXZ6dGN3ZWdheW9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3ODg0MjEsImV4cCI6MjEwMjM2NDQyMX0.DSOSXSfxHNiIgMOy-pJMPQuMDd4JJmyhzG_9jGxnt2c
        run: |
          chmod +x scripts/deploy-azure.sh
          ./scripts/deploy-azure.sh
