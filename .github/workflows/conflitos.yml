name: Conflitos de segregação de funções

# Leitura, e só leitura. Não altera uma linha.
#
# O relatório nocturno diz "REVISOES_ABERTAS|81 (conflito: 76…)" e mais nada.
# 76 é um número que não se decide: não diz quem, não diz que par, e sobretudo
# não diz se o conflito ainda existe. A revisão é aberta no momento em que a
# concessão é escrita e fica aberta para sempre até alguém a fechar — se a
# permissão foi revogada entretanto, a revisão continua lá a apontar para um
# conflito que já não existe.
#
# Por isso este workflow responde a duas perguntas separadas, e a ordem
# importa:
#
#   HOJE — que pessoas acumulam, NESTE momento, os dois lados de um par
#          declarado. Calculado das próprias concessões válidas, não das
#          revisões. É esta a lista que se decide.
#
#   REVISÕES — quantos papéis estão abertos na fila, por par. Serve para saber
#          quanto trabalho administrativo há e quanto dele é eco: várias
#          revisões da mesma pessoa e do mesmo par contam uma vez em HOJE.
#
# O portão não entra nesta conta de propósito. A permissão é da pessoa e fica
# registada mesmo com o portão fechado; quem acumula um par acumula-o na mesma
# no dia em que o portão abrir. Mas a coluna PORTÃO diz-se, porque muda a
# urgência: um conflito de quem entra hoje é diferente de um conflito de quem
# não entra.

on:
  workflow_dispatch:

concurrency:
  group: vm-supabase
  cancel-in-progress: false

jobs:
  conflitos:
    runs-on: ubuntu-latest
    name: Ler os conflitos de segregação
    steps:
      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Consultar a base
        env:
          RG: rg-xpto-plataforma
          VM: vm-supabase
        run: |
          set -euo pipefail

          cat > consulta.sql <<'FIMSQL'
          -- Os pares declarados. A regra em si, para se poder discutir a regra
          -- e nao so as suas consequencias. Os dois lados de cada par vivem
          -- sempre na mesma aplicacao, por isso o nome dela nao se repete.
          select 'REGRA|' || c.app_a || '/' || c.code_a
                 || ' + ' || c.code_b
                 || '|' || c.severidade
                 || '|' || c.motivo
            from public.shaar_permission_conflito c
           order by c.app_a, c.code_a;

          -- Quantas pessoas acumulam cada par AGORA. Das concessoes validas,
          -- nao das revisoes: a revisao e um papel aberto no passado, o par
          -- acumulado e um facto do presente.
          select 'POR_PAR|' || c.app_a || '/' || c.code_a || ' + ' || c.code_b
                 || '|' || count(distinct ga.user_id)::text
            from public.shaar_permission_conflito c
            join public.shaar_permission_grant ga
              on ga.app_code = c.app_a and ga.code = c.code_a
             and ga.efeito = 'permitir'
             and ga.valido_de <= now()
             and (ga.valido_ate is null or ga.valido_ate > now())
            join public.shaar_permission_grant gb
              on gb.user_id = ga.user_id
             and gb.app_code = c.app_b and gb.code = c.code_b
             and gb.efeito = 'permitir'
             and gb.valido_de <= now()
             and (gb.valido_ate is null or gb.valido_ate > now())
            join public.users u on u.id = ga.user_id and u.active
           group by c.app_a, c.code_a, c.code_b
           order by 1;

          -- A fila administrativa, por par. Conta papeis, nao pessoas.
          select 'REVISAO_POR_PAR|' || coalesce(r.detalhe ->> 'par', '(sem par)')
                 || '|' || count(*)::text
                 || '|' || count(distinct r.user_id)::text
            from public.shaar_permission_revisao r
           where r.gatilho = 'conflito' and r.resolvido_em is null
           group by r.detalhe ->> 'par'
           order by 1;

          select 'TOTAL|' || count(*)::text || '|' || count(distinct user_id)::text
            from public.shaar_permission_revisao
           where gatilho = 'conflito' and resolvido_em is null;

          -- Revisoes abertas cujo conflito ja nao existe: a permissao de um dos
          -- lados foi revogada depois de o aviso ter sido dado. Fecham-se sem
          -- decidir nada, e por isso contam-se a parte.
          select 'REVISAO_SEM_CONFLITO|' || count(*)::text
            from public.shaar_permission_revisao r
           where r.gatilho = 'conflito' and r.resolvido_em is null
             and not exists (
               select 1
                 from public.shaar_permission_conflito c
                 join public.shaar_permission_grant ga
                   on ga.user_id = r.user_id and ga.app_code = c.app_a
                  and ga.code = c.code_a and ga.efeito = 'permitir'
                 join public.shaar_permission_grant gb
                   on gb.user_id = r.user_id and gb.app_code = c.app_b
                  and gb.code = c.code_b and gb.efeito = 'permitir'
                where c.app_a || '/' || c.code_a || ' + ' || c.app_b || '/' || c.code_b
                      = r.detalhe ->> 'par');

          -- A lista que se decide, uma linha por PESSOA. Fica em ultimo lugar
          -- de proposito: o `az vm run-command` corta a saida pelo principio,
          -- portanto o que importa imprime-se no fim.
          with acumula as (
            select ga.user_id,
                   c.app_a || '/' || c.code_a || ' + ' || c.code_b as rotulo,
                   (pa.user_id is not null and pb.user_id is not null) as entra_nas_duas
              from public.shaar_permission_conflito c
              join public.shaar_permission_grant ga
                on ga.app_code = c.app_a and ga.code = c.code_a
               and ga.efeito = 'permitir'
               and ga.valido_de <= now()
               and (ga.valido_ate is null or ga.valido_ate > now())
              join public.shaar_permission_grant gb
                on gb.user_id = ga.user_id
               and gb.app_code = c.app_b and gb.code = c.code_b
               and gb.efeito = 'permitir'
               and gb.valido_de <= now()
               and (gb.valido_ate is null or gb.valido_ate > now())
              left join public.shaar_gate_access pa
                on pa.user_id = ga.user_id and pa.app_code = c.app_a
              left join public.shaar_gate_access pb
                on pb.user_id = ga.user_id and pb.app_code = c.app_b
          )
          select 'PESSOA|' || u.email
                 || '|' || u.full_name
                 || '|' || count(*)::text
                 || '|' || string_agg(a.rotulo
                             || case when a.entra_nas_duas then ''
                                     else ' (portao fechado)' end,
                             ' ; ' order by a.rotulo)
            from acumula a
            join public.users u on u.id = a.user_id and u.active
           group by u.email, u.full_name
           order by count(*) desc, u.email;
          FIMSQL

          B64=$(base64 -w0 consulta.sql)
          REMOTE="set -e
          PGPW=\$(grep '^POSTGRES_PASSWORD=' /opt/supa/.env | cut -d= -f2-)
          echo '$B64' | base64 -d > /tmp/conflitos.sql
          echo '===INICIO==='
          docker exec -i -e PGPASSWORD=\"\$PGPW\" supabase-db psql -U postgres -h 127.0.0.1 -qtA -f - < /tmp/conflitos.sql
          echo '===FIM==='
          rm -f /tmp/conflitos.sql"

          esperar_a_vm() {
            local t erro
            for t in 1 2 3 4 5 6; do
              erro=$(mktemp)
              if SAIDA_AZ=$(az vm run-command invoke -g "$RG" -n "$VM" \
                              --command-id RunShellScript --scripts "$1" \
                              --query "value[0].message" -o tsv 2>"$erro"); then
                rm -f "$erro"; return 0
              fi
              if grep -qi "in progress" "$erro"; then
                echo "A VM esta ocupada com outro run-command; espero $((t * 10))s (tentativa $t de 6)"
                rm -f "$erro"; sleep $((t * 10)); continue
              fi
              echo "::error::az vm run-command falhou:"; cat "$erro"; rm -f "$erro"; return 1
            done
            echo "::error::A VM ficou ocupada seis tentativas seguidas."; return 1
          }

          esperar_a_vm "$REMOTE" || exit 1
          # O `az vm run-command` corta a saida PELO PRINCIPIO quando ela e longa,
          # e o marcador de inicio e a primeira coisa a desaparecer. Filtrar pelos
          # prefixos em vez da janela entre marcadores faz a leitura sobreviver ao
          # corte; e se o marcador faltar, isso diz-se em vez de se fingir que a
          # lista esta completa.
          SAIDA=$(printf '%s\n' "$SAIDA_AZ" \
                  | grep -E '^(REGRA|POR_PAR|REVISAO_POR_PAR|TOTAL|REVISAO_SEM_CONFLITO|PESSOA)\|' || true)

          if ! printf '%s\n' "$SAIDA_AZ" | grep -q '===INICIO==='; then
            echo "::warning::A saida da VM veio cortada no inicio (limite do az vm run-command): faltam linhas, e as que faltam sao as primeiras."
          fi

          if [ -z "$SAIDA" ]; then
            echo "::error::Nao consegui ler os conflitos. Saida em bruto:"
            printf '%s\n' "$SAIDA_AZ"
            exit 1
          fi

          printf '%s\n' "$SAIDA"

          {
            echo "## Conflitos de segregação de funções"
            echo ""
            echo "### Quem acumula pares HOJE"
            echo ""
            echo "| Pessoa | E-mail | Pares | Quais |"
            echo "|---|---|---|---|"
            printf '%s\n' "$SAIDA" | awk -F'|' '$1=="PESSOA"{printf "| %s | %s | %s | %s |\n",$3,$2,$4,$5}'
            echo ""
            echo "### Pessoas por par, agora"
            echo ""
            echo "| Par | Pessoas |"
            echo "|---|---|"
            printf '%s\n' "$SAIDA" | awk -F'|' '$1=="POR_PAR"{printf "| %s | %s |\n",$2,$3}'
            echo ""
            echo "### Fila de revisão (papéis abertos, não pessoas)"
            echo ""
            echo "| Par | Revisões | Pessoas |"
            echo "|---|---|---|"
            printf '%s\n' "$SAIDA" | awk -F'|' '$1=="REVISAO_POR_PAR"{printf "| %s | %s | %s |\n",$2,$3,$4}'
            echo ""
            echo "### A regra"
            echo ""
            echo "| Par | Severidade | Motivo |"
            echo "|---|---|---|"
            printf '%s\n' "$SAIDA" | awk -F'|' '$1=="REGRA"{printf "| %s | %s | %s |\n",$2,$3,$4}'
          } >> "$GITHUB_STEP_SUMMARY"
