name: Estado da Central de Permissionamento

# Verificação só de LEITURA do estado da autorização. Não altera nada.
#
# Existe por uma razão prática: o acesso de linha de comando à VM da base é
# restrito, e sem ele não há como saber se a Central continua a dizer o mesmo
# que as aplicações decidem. Este workflow põe essa observação num canal
# auditável — corre com as credenciais do repositório, deixa registo em cada
# execução, e qualquer pessoa da equipa pode lê-lo sem ter acesso à máquina.
#
# O número que importa é a DIVERGÊNCIA. Enquanto for zero, a Central sabe
# responder exactamente o que cada aplicação já decide, e trocar a autoridade
# de mais uma aplicação não muda nada para quem trabalha. Se subir acima de
# zero, alguém mexeu num modelo antigo e as duas realidades começaram a
# afastar-se: é aí que se pára, e não depois. Por isso o job fica VERMELHO —
# um relatório que ninguém lê não protege nada; um job vermelho lê-se.
#
# O segundo número que importa é a IDENTIDADE. A Central resolve quem está a
# pedir por `auth_user_id` OU por e-mail — tem de ser assim, porque há dois
# caminhos de autenticação (Entra ID e credencial local) e a mesma pessoa é a
# mesma linha de `public.users` nos dois. O preço disso é que o e-mail passa a
# ser chave de identidade, e `shaar_usuario_atual` desempata com LIMIT 1. Se
# alguma vez dois registos activos partilharem o e-mail, o desempate é
# arbitrário e alguém pode exercer a autorização de outra pessoa. Por isso
# IDENTIDADE_AMBIGUA tem de ser zero, e também põe o job vermelho.
#
# IDENTIDADE_SO_POR_EMAIL conta as pessoas que só são reconhecidas por e-mail
# (sem `auth_user_id`). Não é erro — é o caminho do Entra ID a funcionar. Mas é
# o número que explica porque é que código antigo que só olha para
# `auth_user_id` se comporta de maneira diferente da Central para essas
# pessoas, e por isso fica à vista em vez de ser descoberto por acidente.
#
# O SQL vai em base64, como no pipeline de migrations. Não é preciosismo: o
# SQL precisa de plicas para os literais, o script remoto precisa de plicas
# para não expandir nada, e aspas duplas em PostgreSQL nomeiam colunas em vez
# de fazerem texto. Codificar resolve as três coisas de uma vez.

on:
  workflow_dispatch:
  schedule:
    # 02:15 UTC = 23:15 em Brasília, quinze minutos depois da sincronização do
    # directório e do ciclo de vida. Mede o estado já com o dia fechado.
    - cron: '15 2 * * *'

# Os tres workflows que falam com a base partilham este grupo de proposito. O
# `az vm run-command` nao aceita duas execucoes ao mesmo tempo na mesma VM —
# responde Conflict e o job morre. Como o recurso disputado e a VM e nao o
# workflow, o grupo tem de ser o da VM. Serializar e a intencao, nao um efeito
# lateral: uma migracao a meio de uma leitura de estado daria um relatorio de
# um estado que ja nao existe.
concurrency:
  group: vm-supabase
  cancel-in-progress: false

jobs:
  estado:
    runs-on: ubuntu-latest
    name: Ler o estado da Central
    steps:
      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Consultar a base
        env:
          RG: rg-xpto-plataforma
          VM: vm-supabase
        run: |
          set -euo pipefail

          cat > consulta.sql <<'FIMSQL'
          select 'DIVERGENCIA|' || count(*) from public.shaar_permissao_divergencias;
          select 'REAL_TETELESTAI|controlo ' || r.controlo_positivos
                 || ' / perde ' || r.perdia
                 || ' / ganha sem revisao ' || r.ganha_sem_revisao
                 || ' / ganha com revisao ' || (r.ganharia - r.ganha_sem_revisao)
                 || ' / pares ' || r.pares_avaliados
            from public.shaar_divergencia_real_resumo('TETELESTAI') r;
          -- O BNEI e o TIKKUN tem funcoes proprias, e o TIKKUN nem sequer aparece
          -- na comparacao modelada — o modelo dele e uma funcao que depende de
          -- quem pergunta, e isso nao se escreve numa vista. Sem estas duas
          -- linhas o TIKKUN ficava sem verificacao nenhuma.
          select 'REAL_BNEI|controlo ' || r.controlo_positivos
                 || ' / perde ' || r.perdia
                 || ' / ganha sem revisao ' || r.ganha_sem_revisao
                 || ' / pares ' || r.pares_avaliados
            from public.shaar_divergencia_real_resumo('BNEI', 'bnei_has_permission_legado') r;
          select 'REAL_TIKKUN|controlo ' || r.controlo_positivos
                 || ' / perde ' || r.perdia
                 || ' / ganha sem revisao ' || r.ganha_sem_revisao
                 || ' / pares ' || r.pares_avaliados
            from public.shaar_divergencia_real_resumo('TIKKUN', 'tikkun_capacidade_legada') r;
          -- A permissao e da pessoa; o portao diz se ela entra hoje. Se um
          -- direito do modelo antigo nao estiver guardado, abrir o portao a
          -- essa pessoa amanha nao lhe daria nada — e esse e o unico sentido
          -- em que uma permissao se perde de verdade.
          select 'DIREITOS_POR_GUARDAR|' || count(*)
            from public.shaar_permissao_verdade_antiga a
            left join public.shaar_permission_grant g
              on g.user_id = a.user_id and g.app_code = a.app_code and g.code = a.code
           where g.user_id is null;
          select 'DIREITOS_SEM_PORTAO|' || coalesce(
                   string_agg(app_code || ' ' || n, ', ' order by app_code), 'nenhum')
            from (
              select g.app_code, count(*)::text as n
                from public.shaar_permission_grant g
               where not exists (select 1 from public.shaar_gate_access ga
                                  where ga.user_id = g.user_id
                                    and ga.app_code = g.app_code)
               group by g.app_code
            ) d;
          select 'TESTES_AUTORIZACAO|' || count(*) filter (where passou) || '/' || count(*)
            from public.shaar_correr_testes();
          select 'TESTES_ESCOPO|' || count(*) filter (where passou) || '/' || count(*)
            from public.shaar_correr_testes_escopo();
          select 'CATALOGO|' || count(*) || ' permissoes em ' || count(distinct app_code) || ' aplicacoes'
            from public.shaar_permission;
          select 'CONCESSOES|' || count(*) || ' para ' || count(distinct user_id) || ' pessoas'
            from public.shaar_permission_grant;
          select 'COM_ESCOPO|' || count(*) from public.shaar_permission_grant
            where escopo <> '{}'::jsonb;
          select 'NEGACOES_EXPLICITAS|' || count(*) from public.shaar_permission_grant
            where efeito = 'negar';
          select 'A_EXPIRAR_EM_7_DIAS|' || count(*) from public.shaar_permission_grant
            where valido_ate is not null
              and valido_ate between now() and now() + interval '7 days';
          select 'REVISOES_ABERTAS|' || (select count(*) from public.shaar_permission_revisao
                                             where resolvido_em is null)
                 || ' (' || coalesce((select string_agg(g || ': ' || n, ', ' order by n desc)
                                        from (select gatilho as g, count(*)::text as n
                                                from public.shaar_permission_revisao
                                               where resolvido_em is null
                                               group by gatilho) x), '-') || ')';
          select 'HISTORICO|' || count(*) || ' eventos' from public.shaar_permission_event;
          select 'APLICACOES_A_OBEDECER|' || coalesce(string_agg(distinct a, ', '), 'nenhuma')
            from (
              select upper(split_part(c.relname, '_', 1)) as a
                from pg_policy p
                join pg_class c on c.oid = p.polrelid
                join pg_namespace n on n.oid = c.relnamespace
               where n.nspname = 'public'
                 and p.polname like '%\_perm\_%'
                 and not p.polpermissive
              union
              -- O interruptor deixou de saber nomes: quem obedece esta na
              -- tabela. Ler o corpo da funcao ja nao diria nada.
              select c.app_code from public.shaar_app_central c
            ) t;
          select 'CODIGOS_EM_MAIS_DE_UMA_APP|' || coalesce(
                   string_agg(c || ' (' || apps || ')', ', ' order by c), 'nenhum')
            from (
              select sp.code as c, string_agg(distinct sp.app_code, '+') as apps
                from public.shaar_permission sp
               where sp.active and sp.origem = 'herdado'
               group by sp.code
              having count(distinct sp.app_code) > 1
            ) d;
          select 'CODIGOS_ANTIGOS_FORA_DO_CATALOGO|' || count(distinct p.code)
            from public.permissions p
           where not exists (select 1 from public.shaar_permission sp where sp.code = p.code);
          select 'DECISAO_FORA_DA_CENTRAL|' || count(*)
            from pg_policy p
            join pg_class c on c.oid = p.polrelid
            join pg_namespace n on n.oid = c.relnamespace
           where n.nspname = 'public'
             and (coalesce(pg_get_expr(p.polqual, p.polrelid), '')
               || coalesce(pg_get_expr(p.polwithcheck, p.polrelid), '')) ~ 'jireh_has_permission_legado';
          select 'FUNCOES_FORA_DA_CENTRAL|' ||
                 coalesce(string_agg(p.proname, ', ' order by p.proname), 'nenhuma')
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
           where n.nspname = 'public' and p.prokind = 'f'
             -- As funcoes de diagnostico chamam a legada de proposito: e o
             -- que elas fazem. Nao sao decisoes por fora da Central.
             and p.proname not in ('has_permission', 'jireh_has_permission',
                                   'jireh_has_permission_legado',
                                   'shaar_divergencia_real',
                                   'shaar_divergencia_real_resumo',
                                   'shaar_impersonacao_funciona')
             and pg_get_functiondef(p.oid) ~ 'jireh_has_permission_legado';
          select 'FORA_DA_CENTRAL_POR_APP|' ||
                 coalesce(string_agg(app || ': ' || n, ', ' order by n desc), 'nenhuma')
            from (
              select coalesce(sp.app_code, '(codigo desconhecido)') as app,
                     count(*)::text as n
                from (
                  select coalesce(pg_get_expr(p.polqual, p.polrelid), '')
                      || coalesce(pg_get_expr(p.polwithcheck, p.polrelid), '') as txt
                    from pg_policy p
                    join pg_class c on c.oid = p.polrelid
                    join pg_namespace n on n.oid = c.relnamespace
                   where n.nspname = 'public'
                  union all
                  select pg_get_functiondef(f.oid)
                    from pg_proc f join pg_namespace n on n.oid = f.pronamespace
                   where n.nspname = 'public' and f.prokind = 'f'
                     and f.proname not in ('has_permission', 'jireh_has_permission',
                                           'jireh_has_permission_legado',
                                           'shaar_divergencia_real',
                                           'shaar_divergencia_real_resumo',
                                           'shaar_impersonacao_funciona')
                     and pg_get_functiondef(f.oid) ~ 'jireh_has_permission_legado'
                ) src
                cross join lateral regexp_matches(
                  src.txt, 'jireh_has_permission_legado\([ (]*''([a-zA-Z0-9_.:-]+)''', 'g') as m
                left join public.shaar_permission sp on sp.code = m[1]
               group by 1
            ) t;
          select 'CHAMADAS_DIRECTAS|' || coalesce(
                   string_agg(distinct replace(substring(m[1] from 1 for 48), '|', '!'), ' / '),
                   'nenhuma')
            from (
              select coalesce(pg_get_expr(p.polqual, p.polrelid), '')
                  || coalesce(pg_get_expr(p.polwithcheck, p.polrelid), '') as txt
                from pg_policy p
                join pg_class c on c.oid = p.polrelid
                join pg_namespace n on n.oid = c.relnamespace
               where n.nspname = 'public'
            ) src
            cross join lateral regexp_matches(
              src.txt, 'jireh_has_permission_legado(.{0,48})', 'g') as m;
          select 'IDENTIDADE_SO_POR_EMAIL|' || count(*)
            from public.users u
           where u.active and not u.blocked and u.auth_user_id is null
             and exists (select 1 from public.shaar_gate_access g where g.user_id = u.id);
          select 'IDENTIDADE_SEM_CONTA_AUTH|' || count(*)
            from public.users u
           where u.active and not u.blocked and u.auth_user_id is null
             and exists (select 1 from public.shaar_gate_access g where g.user_id = u.id)
             and not exists (select 1 from auth.users a where lower(a.email) = lower(u.email));
          select 'IDENTIDADE_EMAIL_VAZIO|' || count(*)
            from public.users u
           where u.active and not u.blocked
             and coalesce(u.email, '') = '';
          select 'IDENTIDADE_AMBIGUA|' || count(*) from (
            select lower(u.email) as e
              from public.users u
             where u.active and not u.blocked
             group by lower(u.email)
            having count(*) > 1
            union
            select lower(a.email)
              from auth.users a
              join public.users u on lower(u.email) = lower(a.email)
             where u.active and not u.blocked
             group by lower(a.email)
            having count(distinct a.id) > 1
          ) d;
          select 'HISTORICO_IMUTAVEL|' || case
                   when has_table_privilege('authenticated','public.shaar_permission_event','UPDATE')
                     or has_table_privilege('authenticated','public.shaar_permission_event','DELETE')
                   then 'FALHA - historico editavel' else 'sim' end;
          FIMSQL

          B64=$(base64 -w0 consulta.sql)
          REMOTE="set -e
          PGPW=\$(grep '^POSTGRES_PASSWORD=' /opt/supa/.env | cut -d= -f2-)
          echo '$B64' | base64 -d > /tmp/estado-central.sql
          echo '===INICIO==='
          docker exec -i -e PGPASSWORD=\"\$PGPW\" supabase-db psql -U postgres -h 127.0.0.1 -qtA -f - < /tmp/estado-central.sql
          echo '===FIM==='
          rm -f /tmp/estado-central.sql"

          # A extensao RunCommand da VM continua ocupada durante algum tempo depois
          # de o comando anterior ja ter devolvido a saida, e nesse intervalo o
          # Azure responde Conflict. Nao e erro nosso nem da base: e esperar.
          # Um relatorio que fica vermelho por isto ensina a ignorar alarmes.
          esperar_a_vm() {   # $@ = argumentos para --scripts
            local t erro
            for t in 1 2 3 4 5 6; do
              erro=$(mktemp)
              if SAIDA_AZ=$(az vm run-command invoke -g "$RG" -n "$VM" \
                              --command-id RunShellScript --scripts "$1" \
                              --query "value[0].message" -o tsv 2>"$erro"); then
                rm -f "$erro"; return 0
              fi
              if grep -qi "in progress" "$erro"; then
                echo "A VM esta ocupada com outro run-command; espero $((t * 10))s (tentativa $t de 6)"
                rm -f "$erro"; sleep $((t * 10)); continue
              fi
              echo "::error::az vm run-command falhou:"; cat "$erro"; rm -f "$erro"; return 1
            done
            echo "::error::A VM ficou ocupada seis tentativas seguidas."; return 1
          }

          esperar_a_vm "$REMOTE" || exit 1
          BRUTO="$SAIDA_AZ"
          SAIDA=$(printf '%s\n' "$BRUTO" | awk '/===INICIO===/{f=1;next} /===FIM===/{f=0} f' | grep '|' || true)

          if [ -z "$SAIDA" ]; then
            echo "::error::Nao consegui ler o estado da base. Saida em bruto:"
            printf '%s\n' "$BRUTO"
            exit 1
          fi

          printf '%s\n' "$SAIDA"

          {
            echo "## Estado da Central de Permissionamento"
            echo ""
            echo "| Indicador | Valor |"
            echo "|---|---|"
            printf '%s\n' "$SAIDA" | while IFS='|' read -r k v; do
              printf '| %s | %s |\n' "$k" "$v"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          DIV=$(printf '%s\n' "$SAIDA" | awk -F'|' '/^DIVERGENCIA\|/{print $2}' | tr -d '[:space:]')
          REAL=$(printf '%s\n' "$SAIDA" | awk -F'|' '/^REAL_TETELESTAI\|/{print $2}')
          R_CTL=$(printf '%s\n' "$REAL" | awk '{print $2}')
          R_PER=$(printf '%s\n' "$REAL" | awk '{print $5}')
          R_GSR=$(printf '%s\n' "$REAL" | awk '{print $10}')
          for APLIC in BNEI TIKKUN; do
            L=$(printf '%s\n' "$SAIDA" | awk -F'|' -v a="^REAL_${APLIC}\\|" '$0 ~ a {print $2}')
            C=$(printf '%s\n' "$L" | awk '{print $2}')
            P=$(printf '%s\n' "$L" | awk '{print $5}')
            G=$(printf '%s\n' "$L" | awk '{print $10}')
            if [ "${C:-0}" = "0" ]; then
              echo "::error::O controlo da impersonacao do ${APLIC} deu zero: a medicao nao esta a funcionar e os numeros dela nao valem nada."
              FALHOU=1
            fi
            if [ "${P:-x}" != "0" ]; then
              echo "::error::${P} respostas em que alguem COM portao perde acesso no ${APLIC}."
              FALHOU=1
            fi
            if [ "${G:-x}" != "0" ]; then
              echo "::error::${G} respostas de acesso novo no ${APLIC} a gente sem revisao aberta."
              FALHOU=1
            fi
          done
          AMB=$(printf '%s\n' "$SAIDA" | awk -F'|' '/^IDENTIDADE_AMBIGUA\|/{print $2}' | tr -d '[:space:]')
          VAZ=$(printf '%s\n' "$SAIDA" | awk -F'|' '/^IDENTIDADE_EMAIL_VAZIO\|/{print $2}' | tr -d '[:space:]')
          TA=$(printf '%s\n' "$SAIDA" | awk -F'|' '/^TESTES_AUTORIZACAO\|/{print $2}')
          TE=$(printf '%s\n' "$SAIDA" | awk -F'|' '/^TESTES_ESCOPO\|/{print $2}')

          FALHOU=0
          if [ "${DIV:-x}" != "0" ]; then
            echo "::error::Divergencia ${DIV} entre a Central e os modelos antigos. Nao trocar a autoridade de mais nenhuma aplicacao ate voltar a zero, e descobrir quem mexeu no modelo antigo."
            FALHOU=1
          fi
          # A regra da troca nao e "zero divergencias" — e mais fina. Ninguem pode
          # PERDER acesso; alguem pode GANHAR, mas so com revisao aberta, ou seja
          # so se houver alguem a quem foi pedido que confirme. E nada disto vale
          # se o controlo da impersonacao nao for positivo.
          if [ "${R_CTL:-0}" = "0" ]; then
            echo "::error::O controlo da impersonacao deu zero: a funcao antiga nunca respondeu verdadeiro a ninguem com auth_user_id. A medicao da divergencia real nao esta a funcionar, e nenhum dos outros numeros dela vale nada."
            FALHOU=1
          fi
          GUARD=$(printf '%s\n' "$SAIDA" | awk -F'|' '/^DIREITOS_POR_GUARDAR\|/{print $2}' | tr -d '[:space:]')
          if [ "${GUARD:-x}" != "0" ]; then
            echo "::error::${GUARD} direitos do modelo antigo nao estao guardados na Central. A permissao e da pessoa e o portao e independente: se o direito nao estiver guardado, abrir o portao a essa pessoa amanha nao lhe da nada. E o unico sentido em que uma permissao se perde de verdade."
            FALHOU=1
          fi
          if [ "${R_PER:-x}" != "0" ]; then
            echo "::error::${R_PER} respostas em que alguem PERDE acesso por causa da troca. Isto nunca e aceitavel: reverter tirando a condicao do TETELESTAI de jireh_has_permission."
            FALHOU=1
          fi
          if [ "${R_GSR:-x}" != "0" ]; then
            echo "::error::${R_GSR} respostas em que alguem GANHA acesso sem ter revisao aberta — ou seja, sem que ninguem tenha sido chamado a decidir. E exactamente o que esta Central existe para impedir."
            FALHOU=1
          fi
          if [ "${VAZ:-x}" != "0" ]; then
            echo "::error::${VAZ} pessoa(s) activa(s) com e-mail vazio. O e-mail e chave de identidade: uma linha com e-mail vazio casa com qualquer pedido que chegue sem claim de e-mail. Preencher ou desactivar."
            FALHOU=1
          fi
          if [ "${AMB:-x}" != "0" ]; then
            echo "::error::${AMB} e-mail(s) resolvem para mais do que uma pessoa. shaar_usuario_atual desempata com LIMIT 1, ou seja, arbitrariamente: alguem pode receber a autorizacao de outra pessoa. Resolver antes de qualquer outra coisa."
            FALHOU=1
          fi
          for T in "$TA" "$TE"; do
            case "$T" in
              *"/"*) [ "${T%%/*}" = "${T##*/}" ] || { echo "::error::Testes de autorizacao a falhar: $T"; FALHOU=1; } ;;
              *) echo "::error::Nao consegui ler os testes: $T"; FALHOU=1 ;;
            esac
          done
          [ "$FALHOU" = "0" ] || exit 1
          echo "Divergencia zero e testes verdes. O contador dos sete dias continua."
