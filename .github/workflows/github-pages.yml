name: Publicar preview (GitHub Pages)

# Ambiente de visualizacao do SHAAR enquanto o Azure Static Web Apps nao esta
# disponivel. O passo configure-pages liga o GitHub Pages sozinho na primeira
# execucao (enablement: true) — nao e preciso mexer em Settings.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/github-pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Pages (liga se ainda estiver desligado)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Endereco publicado
        run: echo "::notice title=SHAAR no ar::${{ steps.deploy.outputs.page_url }}"
