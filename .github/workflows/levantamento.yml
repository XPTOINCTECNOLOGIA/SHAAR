name: Levantamento para trocar a autoridade

# Ferramenta de LEITURA para preparar a fase 5 de cada aplicação. Não altera
# nada; não aceita SQL de fora.
#
# A pergunta que ela responde é a única que interessa antes de ligar a chave:
#
#     se eu passar a exigir a permissão X, quantas das pessoas que hoje
#     entram nesta aplicação deixam de conseguir trabalhar?
#
# Se a resposta for zero, a política é um espelho do que já se passa e pode
# entrar. Se for diferente de zero, ou o mapeamento está errado, ou as
# concessões estão erradas — e nos dois casos isso decide-se antes, não
# depois de alguém ficar sem trabalhar na segunda-feira de manhã.
#
# As consultas são fixas. O que vem de fora são dois valores, ambos apertados
# por expressão regular: o código da aplicação e um padrão de nome de tabela.
# Não é paranoia deslocada — este workflow corre com credenciais do Azure
# sobre a base de produção de um sistema de autorização. Um campo de SQL
# livre aqui seria uma porta das traseiras à volta de tudo o que a Central
# está a construir.

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Código da aplicação (ex.: TETELESTAI)'
        required: true
        type: string
      tabelas:
        description: 'Padrão LIKE das tabelas (ex.: todo% ou operation%). Vazio = nenhuma.'
        required: false
        default: ''
        type: string
      funcao:
        description: 'Nome exacto de UMA função cujo corpo se quer ver. Vazio = nenhuma.'
        required: false
        default: ''
        type: string
      parte:
        description: 'Que pedaço do corpo (1, 2, 3…). Cada pedaço tem 1500 caracteres.'
        required: false
        default: '1'
        type: string

# Os tres workflows que falam com a base partilham este grupo de proposito. O
# `az vm run-command` nao aceita duas execucoes ao mesmo tempo na mesma VM —
# responde Conflict e o job morre. Como o recurso disputado e a VM e nao o
# workflow, o grupo tem de ser o da VM. Serializar e a intencao, nao um efeito
# lateral: uma migracao a meio de uma leitura de estado daria um relatorio de
# um estado que ja nao existe.
concurrency:
  group: vm-supabase
  cancel-in-progress: false

jobs:
  levantar:
    runs-on: ubuntu-latest
    name: Levantar o terreno
    steps:
      - name: Validar entradas
        env:
          APP: ${{ inputs.app }}
          TAB: ${{ inputs.tabelas }}
          FUN: ${{ inputs.funcao }}
          PARTE: ${{ inputs.parte }}
        run: |
          set -euo pipefail
          echo "$APP" | grep -qE '^[A-Z][A-Z0-9_]{1,31}$' || {
            echo "::error::Codigo de aplicacao invalido: $APP"; exit 1; }
          if [ -n "$TAB" ]; then
            echo "$TAB" | grep -qE '^[a-z0-9_%]{2,40}$' || {
              echo "::error::Padrao de tabela invalido: $TAB"; exit 1; }
          fi
          if [ -n "$FUN" ]; then
            echo "$FUN" | grep -qE '^[a-z_][a-z0-9_]{2,60}$' || {
              echo "::error::Nome de funcao invalido: $FUN"; exit 1; }
          fi
          echo "${PARTE:-1}" | grep -qE '^[1-9][0-9]?$' || {
            echo "::error::Parte invalida: $PARTE"; exit 1; }
          echo "app=$APP tabelas=${TAB:-nenhuma} funcao=${FUN:-nenhuma}"

      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Consultar
        env:
          RG: rg-xpto-plataforma
          VM: vm-supabase
          APP: ${{ inputs.app }}
          TAB: ${{ inputs.tabelas }}
          FUN: ${{ inputs.funcao }}
          PARTE: ${{ inputs.parte }}
        run: |
          set -euo pipefail

          # As entradas já passaram pela regex do passo anterior. Vão para o SQL
          # por psql -v, e são usadas com :'app' — que cita como literal e não
          # como pedaço de texto colado.
          cat > consulta.sql <<'FIMSQL'
          \echo === IMPACTO POR PERMISSAO ===
          \echo Quantas pessoas com o portao aberto TEM cada permissao, e quantas ficariam de fora.
          with porta as (
            select g.user_id from public.shaar_gate_access g where g.app_code = :'app'
          )
          select c.code,
                 c.name,
                 (select count(*) from porta)                                as com_portao,
                 count(gr.user_id)                                           as tem,
                 (select count(*) from porta) - count(gr.user_id)            as ficariam_de_fora
            from public.shaar_permission c
            left join public.shaar_permission_grant gr
                   on gr.app_code = c.app_code and gr.code = c.code
                  and gr.efeito = 'permitir'
                  and gr.user_id in (select user_id from porta)
           where c.app_code = :'app' and c.active
           group by c.code, c.name
           order by 5 desc, 1;

          \echo
          \echo === TABELAS ===
          select c.relname                                     as tabela,
                 c.relrowsecurity                              as rls,
                 (select count(*) from pg_policy p where p.polrelid = c.oid) as politicas,
                 coalesce((select s.n_live_tup from pg_stat_user_tables s
                            where s.relid = c.oid), 0)         as linhas
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
           where n.nspname = 'public' and c.relkind = 'r'
             and :'tab' <> '' and c.relname like :'tab'
           order by 1;

          \echo
          \echo === POLITICAS EXISTENTES ===
          select c.relname                                    as tabela,
                 p.polname                                    as politica,
                 case p.polcmd when 'r' then 'select' when 'a' then 'insert'
                               when 'w' then 'update' when 'd' then 'delete'
                               else 'all' end                 as comando,
                 case when p.polpermissive then 'permissiva' else 'RESTRITIVA' end as tipo,
                 left(coalesce(pg_get_expr(p.polqual, p.polrelid), '-'), 90) as usando
            from pg_policy p
            join pg_class c on c.oid = p.polrelid
            join pg_namespace n on n.oid = c.relnamespace
           where n.nspname = 'public'
             and :'tab' <> '' and c.relname like :'tab'
           order by 1, 2;

          \echo
          \echo === QUEM JA DECIDE POR PERMISSAO ===
          \echo Politicas RLS que ja chamam uma funcao de permissao. Estas nao se
          \echo inventam de novo: aponta-se a que existe para a Central.
          select c.relname                                   as tabela,
                 p.polname                                   as politica,
                 case p.polcmd when 'r' then 'select' when 'a' then 'insert'
                               when 'w' then 'update' when 'd' then 'delete'
                               else 'all' end                as comando,
                 left(coalesce(pg_get_expr(p.polqual, p.polrelid),
                               pg_get_expr(p.polwithcheck, p.polrelid), '-'), 80) as usando
            from pg_policy p
            join pg_class c on c.oid = p.polrelid
            join pg_namespace n on n.oid = c.relnamespace
           where n.nspname = 'public'
             and (coalesce(pg_get_expr(p.polqual, p.polrelid), '') ~ 'has_permission|shaar_pode'
               or coalesce(pg_get_expr(p.polwithcheck, p.polrelid), '') ~ 'has_permission|shaar_pode')
           order by 1, 2;

          \echo
          \echo === RESUMO: QUEM DECIDE, POR PREFIXO DE TABELA ===
          select split_part(c.relname, '_', 1)                          as prefixo,
                 count(*) filter (where coalesce(pg_get_expr(p.polqual, p.polrelid),
                        pg_get_expr(p.polwithcheck, p.polrelid),'') ~ 'has_permission') as por_perfil,
                 count(*) filter (where coalesce(pg_get_expr(p.polqual, p.polrelid),
                        pg_get_expr(p.polwithcheck, p.polrelid),'') ~ 'shaar_pode')     as pela_central
            from pg_policy p
            join pg_class c on c.oid = p.polrelid
            join pg_namespace n on n.oid = c.relnamespace
           where n.nspname = 'public'
             and (coalesce(pg_get_expr(p.polqual, p.polrelid), '') ~ 'has_permission|shaar_pode'
               or coalesce(pg_get_expr(p.polwithcheck, p.polrelid), '') ~ 'has_permission|shaar_pode')
           group by 1 order by 2 desc, 1;

          \echo
          \echo === O QUE MUDA SE has_permission PASSAR PELA CENTRAL ===
          \echo has_permission olha so o perfil. shaar_pode exige TAMBEM o portao aberto.
          \echo Estas sao as pessoas que perderiam acesso por nao terem portao.
          select sp.app_code,
                 count(distinct u.id)                as pessoas_sem_portao,
                 count(*)                            as permissoes_afectadas,
                 string_agg(distinct u.email::text, ', ' order by u.email::text) as quem
            from public.users u
            join public.profile_permissions pp on pp.profile_id = u.profile_id
            join public.permissions pr         on pr.id = pp.permission_id
            join public.shaar_permission sp    on sp.code = pr.code and sp.origem = 'herdado'
           where u.active and not u.blocked
             and not exists (select 1 from public.shaar_gate_access g
                              where g.user_id = u.id and g.app_code = sp.app_code)
           group by sp.app_code order by 2 desc;

          \echo
          \echo === FUNCOES DE PERMISSAO EXISTENTES ===
          select p.proname || '(' || pg_get_function_arguments(p.oid) || ') -> '
                 || pg_get_function_result(p.oid) as funcao,
                 p.prosecdef                      as security_definer,
                 p.provolatile                    as volatilidade
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
           where n.nspname = 'public'
             and p.proname in ('has_permission','shaar_pode','shaar_porque')
           order by 1;

          \echo
          \echo === CADEIA DE PERMISSAO: QUE FUNCOES EXISTEM ===
          select p.proname, pg_get_function_arguments(p.oid) as argumentos
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
           where n.nspname = 'public' and p.prokind = 'f'
             and (p.proname like '%has_permission%'
               or p.proname in ('current_app_user_id','shaar_usuario_atual'))
           order by 1;

          \echo
          \echo === RISCO INVERSO: QUEM GANHARIA ACESSO ===
          \echo A funcao antiga identifica a pessoa so por auth_user_id. A da Central
          \echo identifica tambem por email. Delegar pode DAR acesso a contas que hoje
          \echo nao conseguem nada. Estas sao as contas activas, com portao, sem
          \echo auth_user_id ligado.
          select count(*) as contas_sem_auth_com_portao,
                 coalesce(string_agg(distinct u.email::text, ', '), '-') as quem
            from public.users u
           where u.active and not u.blocked and u.auth_user_id is null
             and exists (select 1 from public.shaar_gate_access g where g.user_id = u.id);

          \echo
          \echo === QUEM EXERCE POR CARGO, FORA DO PERFIL ===
          \echo A regra encontrada em jireh_has_permission: o cargo CFO exerce as
          \echo permissoes do perfil FINANCEIRO sem que isso esteja em
          \echo profile_permissions. Isto mostra quem e, e quanto herda.
          select u.id, u.email, pos.name as cargo, pf.name as perfil_proprio,
                 (select count(*) from public.profile_permissions pp
                   join public.profiles fin on fin.id = pp.profile_id
                  where upper(fin.name) = 'FINANCEIRO' and fin.active) as herda_do_financeiro
            from public.users u
            join public.positions pos on pos.id = u.position_id and pos.active
            left join public.profiles pf on pf.id = u.profile_id
           where u.active and not u.blocked and upper(pos.name) = 'CFO';
          \echo
          \echo === CORPO DE UMA FUNCAO ===
          \echo Em ultimo lugar de proposito: a saida do az e cortada pelo inicio
          \echo quando e longa, portanto o que tem de chegar inteiro imprime-se no fim.
          \pset format unaligned
          \pset tuples_only on
          select 'PEDACO ' || :'parte' || ' de ' ||
                 ceil(length(pg_get_functiondef(p.oid)) / 1500.0)::int::text ||
                 ' (' || length(pg_get_functiondef(p.oid))::text || ' caracteres)'
                 || chr(10) || '---8<---' || chr(10) ||
                 substring(pg_get_functiondef(p.oid)
                           from ((:'parte')::int - 1) * 1500 + 1 for 1500)
                 || chr(10) || '--->8---'
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
           where n.nspname = 'public' and p.prokind = 'f'
             and :'fun' <> '' and p.proname = :'fun'
           limit 1;
          FIMSQL

          B64=$(base64 -w0 consulta.sql)
          REMOTE="set -e
          PGPW=\$(grep '^POSTGRES_PASSWORD=' /opt/supa/.env | cut -d= -f2-)
          echo '$B64' | base64 -d > /tmp/levantamento.sql
          echo '===INICIO==='
          docker exec -i -e PGPASSWORD=\"\$PGPW\" supabase-db psql -U postgres -h 127.0.0.1 \
            -v app='$APP' -v tab='$TAB' -v fun='$FUN' -v parte='${PARTE:-1}' -f - < /tmp/levantamento.sql
          echo '===FIM==='
          rm -f /tmp/levantamento.sql"

          # A extensao RunCommand da VM continua ocupada durante algum tempo depois
          # de o comando anterior ja ter devolvido a saida, e nesse intervalo o
          # Azure responde Conflict. Nao e erro nosso nem da base: e esperar.
          # Um relatorio que fica vermelho por isto ensina a ignorar alarmes.
          esperar_a_vm() {   # $@ = argumentos para --scripts
            local t erro
            for t in 1 2 3 4 5 6; do
              erro=$(mktemp)
              if SAIDA_AZ=$(az vm run-command invoke -g "$RG" -n "$VM" \
                              --command-id RunShellScript --scripts "$1" \
                              --query "value[0].message" -o tsv 2>"$erro"); then
                rm -f "$erro"; return 0
              fi
              if grep -qi "in progress" "$erro"; then
                echo "A VM esta ocupada com outro run-command; espero $((t * 10))s (tentativa $t de 6)"
                rm -f "$erro"; sleep $((t * 10)); continue
              fi
              echo "::error::az vm run-command falhou:"; cat "$erro"; rm -f "$erro"; return 1
            done
            echo "::error::A VM ficou ocupada seis tentativas seguidas."; return 1
          }

          esperar_a_vm "$REMOTE" || exit 1
          BRUTO="$SAIDA_AZ"

          # Nao filtrar por marcadores. A saida do `az vm run-command` vem
          # truncada no INICIO quando e longa — foi o que aconteceu na primeira
          # execucao: as 35 linhas do impacto chegaram todas, o `===INICIO===`
          # e que nao, e o awk devolveu vazio sobre dados perfeitamente bons.
          # Tirar so o invólucro do az e deixar passar o resto e mais robusto do
          # que depender de uma linha que pode nao sobreviver ao caminho.
          SAIDA=$(printf '%s\n' "$BRUTO" \
            | grep -v '^Enable succeeded:' \
            | grep -vx '\[stdout\]' \
            | grep -vx '\[stderr\]' \
            | grep -vx '===INICIO===' \
            | grep -vx '===FIM===')

          if [ -z "$(printf '%s' "$SAIDA" | tr -d '[:space:]')" ]; then
            echo "::error::Sem resposta da base. Saida em bruto:"
            printf '%s\n' "$BRUTO"
            exit 1
          fi

          printf '%s\n' "$SAIDA"
          {
            echo "## Levantamento — $APP"
            echo ""
            echo '```'
            printf '%s\n' "$SAIDA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
